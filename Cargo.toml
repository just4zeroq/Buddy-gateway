[package]
name = "buddy-gateway"
version = "0.1.0"
edition = "2021"
description = "Multi-platform IM channel bridge for AI agents and bots"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
# Inbound HTTP webhook service (WhatsApp / LINE / WeChat MP / Google Chat).
axum = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Pin a single rustls crypto provider so WSS handshakes don't panic with
# "Could not automatically determine the process-level CryptoProvider".
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# WS-over-HTTP-proxy support (HTTP CONNECT tunneling).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
rumqttc = { version = "0.25", features = ["websocket"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
futures = "0.3"
async-stream = "0.3"
mime_guess = "2"
rand = "0.8"
bytes = "1"
regex = "1"
# --- crypto / codecs (signatures, CDN encryption, COS) ---
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
md5 = "0.7"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = "0.10"
cipher = "0.4"
hex = "0.4"
urlencoding = "2"
percent-encoding = "2"
byteorder = "1"
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
futures = "0.3"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
# The webhook integration tests serve the router on an ephemeral port and drive
# it with real signed HTTP requests.
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Advanced examples live in a subdirectory, so declare them explicitly.
[[example]]
name = "feishu_advanced"
path = "examples/advanced/feishu_advanced.rs"

[[example]]
name = "qq_advanced"
path = "examples/advanced/qq_advanced.rs"

[[example]]
name = "push_scheduler"
path = "examples/advanced/push_scheduler.rs"

# ---------------------------------------------------------------------------
# Build parameters
# ---------------------------------------------------------------------------
# The library is large and CI/consumer builds are latency-sensitive, while
# incremental compilation bloats `target/incremental` (hundreds of MB) and can
# produce stale-artifact surprises. Disable it for deterministic, compact builds.
# `test`/`bench` profiles inherit these settings from `dev`.
[profile.dev]
incremental = false
# Keep only line-table debug info: much smaller artifacts, still adequate for
# readable backtraces (important on constrained/small disks).
debug = "line-tables-only"

[profile.release]
opt-level = 2
